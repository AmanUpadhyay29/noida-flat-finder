<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flat Finder</title>
  <meta name="description" content="Every housing society in Gurugram on one map. Filter by the smallest bedroom you can live with, size, amenities and budget.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <button id="btn-replay" title="Replay the intro">Replay</button>
    <button id="btn-tour" title="Fly through the matches">Tour</button>
    <button id="btn-hide" title="Hide panels for recording">Hide panels</button>
  </div>

  <aside class="panel left" id="filters">
    <div class="k">Flat Finder · <select id="city-pick" aria-label="City"></select></div>
    <h1 class="ttl">Find the flat that fits.</h1>
    <div class="search">
      <input id="q" type="search" placeholder="Search a society, developer or sector" autocomplete="off" aria-label="Search societies">
      <kbd>/</kbd>
      <ol id="q-results" hidden></ol>
    </div>
    <div class="seg" id="f-mode"><button data-m="buy">Buy</button><button data-m="rent">Rent</button></div>
    <button class="preset" id="preset-divy">Load Divy's search</button>

    <section>
      <div class="k">Type</div>
      <div class="chips" id="f-kind"></div>
    </section>
    <section>
      <div class="k">BHK</div>
      <div class="chips" id="f-bhk"></div>
    </section>
    <section>
      <div class="k row">Smallest bedroom <label class="sw"><input type="checkbox" id="f-room-on"> on</label></div>
      <div class="room" id="f-room">
        <select id="ra-ft"></select><select id="ra-in"></select>
        <span class="x">×</span>
        <select id="rb-ft"></select><select id="rb-in"></select>
      </div>
      <div class="hint">Every bedroom must clear both sides.</div>
    </section>
    <section>
      <div class="k row">Home size <span class="val" id="v-size">Any</span></div>
      <input type="range" id="f-size" min="0" max="6000" step="50" value="0">
    </section>
    <section>
      <div class="k row"><span id="l-price">Budget</span> <span class="val" id="v-price">Any</span></div>
      <input type="range" id="f-price" min="0.25" max="20" step="0.25" value="20">
    </section>
    <section>
      <div class="k">Amenities</div>
      <div class="chips" id="f-amen"></div>
    </section>
    <section>
      <label class="sw"><input type="checkbox" id="f-ready"> Ready to move only</label>
    </section>

    <div class="count">
      <div class="k">Matching societies</div>
      <div class="n" id="count">0</div>
      <div class="sub" id="count-sub"></div>
    </div>
    <ol class="results" id="results"></ol>
    <div class="downloads">
      <button id="dl-results">Export these results (CSV)</button>
      <a id="dl-all" download>All societies (CSV)</a>
      <a id="dl-units" download>Unit types and bedrooms (CSV)</a>
    </div>
    <p class="fine about" id="about-prices"></p>
  </aside>

  <aside class="panel right" id="log">
    <div class="k row">Research log <span class="val" id="log-mode">replay</span></div>
    <div class="feed" id="feed"></div>
  </aside>

  <article class="card" id="card" hidden></article>

  <div class="controls">
    <button id="ctl-locate" title="Show my location" aria-label="Show my location"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button id="ctl-home" title="Show the whole city" aria-label="Show the whole city"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <button id="ctl-tilt" title="Switch between flat and 3D" aria-label="Switch between flat and 3D">2D</button>
    <div class="zoom">
      <button id="ctl-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="ctl-out" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
  </div>

  <div class="layers" id="layers">
    <div class="layer-menu">
      <button data-mode="night"><i class="sw-night"></i>Night</button>
      <button data-mode="streets"><i class="sw-streets"></i>Dark map</button>
      <button data-mode="light"><i class="sw-light"></i>Map</button>
    </div>
    <button id="layers-btn" class="layers-btn" title="Map style: night, dark map or day map" aria-label="Map style"><svg viewBox="0 0 24 24" width="16" height="16"><path d="m12 3 9 5-9 5-9-5z M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="note" id="note"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
